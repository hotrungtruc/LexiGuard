[project]
name = "lexiguard"
version = "0.1.0"
description = "Multi-Agent Contract Vulnerability Auditing & Legal Cross-Referencing System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "LexiGuard AI Team", email = "dev@lexiguard.ai" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "qdrant-client>=1.9.0",
    "neo4j>=5.20.0",
    "langchain>=0.2.0",
    "langgraph>=0.1.0",
    "google-genai>=0.1.0",
    "docling>=1.0.0",
    "mcp>=1.0.0",
    "chainlit>=1.1.0",
    "ragas>=0.1.9",
    "langfuse>=2.38.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "loguru>=0.7.2",
    "sentence-transformers>=3.0.0",
    "fastmcp>=0.1.0",
    "fastembed>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
