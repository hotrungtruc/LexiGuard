[project]
name = "lexiguard"
version = "0.1.0"
description = "Multi-Agent Contract Vulnerability Auditing & Legal Cross-Referencing System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "LexiGuard AI Team", email = "dev@lexiguard.ai" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "qdrant-client>=1.9.0",
    "neo4j>=5.20.0",
    "langchain>=0.2.0",
    "langgraph>=0.1.0",
    "langchain-ollama>=0.2.0",
    "google-genai>=0.1.0",
    "docling>=1.0.0",
    "mcp>=1.0.0",
    "chainlit>=1.1.0",
    "ragas>=0.1.9",
    "langfuse>=2.38.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "loguru>=0.7.2",
    "sentence-transformers>=3.0.0",
    "fastmcp>=0.1.0",
    "fastembed>=0.4.0",
    "networkx>=3.3",
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.0",
    "pillow>=10.3.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",  # line too long (legal text & prompts contain long sentences)
    "E402",  # module import not at top of file (scripts configuring sys.path/env)
    "E741",  # ambiguous variable name (l, t, r, b coordinates for BoundingBox)
    "W291",  # trailing whitespace
    "W293",  # blank line contains whitespace
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
